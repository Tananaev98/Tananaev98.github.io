
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Monstrous world</title>
    <link rel="stylesheet" href="main_css.css?v=tikhon-crit-multiplier-cap-2">
    <script src="music/audio-settings.js?v=audio-settings-2026-08-11"></script>
    <script src="enemyAlphaMasks.js?v=hp-bars-revert-2026-08-06"></script>

    <script>
const params = new URLSearchParams(window.location.search);
const requestedLevel = params.get('level') ?? '1';
const parsedLevel = Number(requestedLevel);
const MIN_LEVEL = 1;
const MAX_LEVEL = 141;
const GAME_BUILD_VERSION = 'tikhon-crit-multiplier-cap-2';
const level = Number.isInteger(parsedLevel) && parsedLevel >= MIN_LEVEL && parsedLevel <= MAX_LEVEL
    ? parsedLevel
    : null;

let loadedCount = 0;
let gameStarted = false;
let loadFailed = false;
const totalToLoad = 3; // gameData + saveData + battleMusic

function showLoadError(message) {
    if (loadFailed) return;
    loadFailed = true;

    const renderError = () => {
        const errorPanel = document.createElement('main');
        errorPanel.setAttribute('role', 'alert');
        errorPanel.style.cssText = 'max-width:620px;margin:15vh auto;padding:32px;text-align:center;font-family:sans-serif;color:#3a2418;background:#f6e4c3;border:3px solid #744b2a;border-radius:16px';

        const title = document.createElement('h1');
        title.textContent = 'Не удалось запустить уровень';

        const description = document.createElement('p');
        description.textContent = message;

        const backLink = document.createElement('a');
        backLink.href = 'index.html';
        backLink.textContent = 'Вернуться к выбору уровня';

        errorPanel.append(title, description, backLink);
        document.body.replaceChildren(errorPanel);
    };

    if (document.body) renderError();
    else document.addEventListener('DOMContentLoaded', renderError, { once: true });
}

function checkAllLoaded() {
    if (loadFailed || gameStarted || loadedCount !== totalToLoad || !document.body) return;

    gameStarted = true;
    const gameScript = document.createElement('script');
    gameScript.src = `game.js?v=${GAME_BUILD_VERSION}`;
    gameScript.onerror = () => showLoadError('Файл игрового движка не загрузился.');
    document.body.appendChild(gameScript);
}

document.addEventListener('DOMContentLoaded', checkAllLoaded, { once: true });

if (level === null) {
    showLoadError(`Уровень должен быть целым числом от ${MIN_LEVEL} до ${MAX_LEVEL}.`);
} else {
    document.title = `Monstrous world — уровень ${level}`;

    // Тема области для фона геймплея (см. main_css.css :root/body[data-area]).
    // Необязательна для запуска игры, поэтому не участвует в totalToLoad/checkAllLoaded.
    const areasScript = document.createElement('script');
    areasScript.src = `lvlData/areas.js?v=${GAME_BUILD_VERSION}`;
    areasScript.onload = () => {
        if (typeof getAreaByLevel === 'function' && document.body) {
            document.body.dataset.area = String(getAreaByLevel(level).id);
        }
    };
    document.head.appendChild(areasScript);

    const dataScript = document.createElement('script');
    dataScript.src = `lvlData/gameData${level}.js?v=${GAME_BUILD_VERSION}`;
    dataScript.onload = () => {
        loadedCount++;
        checkAllLoaded();
    };
    dataScript.onerror = () => showLoadError(`Данные уровня ${level} не загрузились.`);
    document.head.appendChild(dataScript);

    const saveScript = document.createElement('script');
    saveScript.src = `saveData.js?v=${GAME_BUILD_VERSION}`;
    saveScript.onload = () => {
        loadedCount++;
        checkAllLoaded();
    };
    saveScript.onerror = () => showLoadError('Система сохранений не загрузилась.');
    document.head.appendChild(saveScript);

    const musicPlaylistScript = document.createElement('script');
    musicPlaylistScript.src = `music/playlist.js?v=${GAME_BUILD_VERSION}`;
    musicPlaylistScript.onload = () => {
        const musicPlayerScript = document.createElement('script');
        musicPlayerScript.src = `music/battle-music.js?v=${GAME_BUILD_VERSION}`;
        musicPlayerScript.onload = () => {
            loadedCount++;
            checkAllLoaded();
        };
        musicPlayerScript.onerror = () => showLoadError('Плеер боевой музыки не загрузился.');
        document.head.appendChild(musicPlayerScript);
    };
    musicPlaylistScript.onerror = () => showLoadError('Плейлист боевой музыки не загрузился.');
    document.head.appendChild(musicPlaylistScript);
}
    </script>

</head>
<body>



<div class="main_menu_image">
	<div class="hero-status-bar" id="heroStatusBar">
		<img src="images/hero/1_babka/dunya_min.webp" class="heroImageClass" id="heroImage" alt="">
		<div class="hero-health-container">
			<div class="health-bar-container" id="hpCont">
				<div class="health-bar" id="heroHealthBar"></div>
				<div class="health-text" id="heroHealthText">Вихревая бабка</div>
			</div>
			<!-- Тихон Речкин — «Дрожащая рука»: шкала волны урона/крит-шанса, под HP-баром,
			     индикатор — бутылка самогона. Показывается только у Тихона (см.
			     initTikhonShakeGauge/updateTikhonShakeGauge в game.js), у остальных
			     героев остаётся скрытой (display:none — тогда HP-бар занимает всю высоту). -->
			<div class="tikhon-shake-gauge" id="tikhonShakeGauge" style="display:none;">
				<div class="tikhon-shake-track" id="tikhonShakeTrack">
					<img src="images/hero/6_TihonRechkin/bottle.webp" class="tikhon-shake-bottle" id="tikhonShakeBottle" alt="Дрожащая рука">
				</div>
			</div>
		</div>
		<div class="statusbar-util-buttons">
			<button type="button" class="statusbar-util-btn restart" id="statusbarRestartBtn" aria-label="Начать заново" title="Начать заново">⟳</button>
			<button type="button" class="statusbar-util-btn base" id="statusbarBaseBtn" aria-label="На базу" title="На базу">🏠</button>
		</div>
	</div>
		
	<!-- Элемент прицела -->
	<div id="aim" class="aim"></div>

	<!-- Контейнер для текста урона -->
	<div id="damage-container"></div>
</div>


<!-- Добавить перед закрывающим тегом </body> -->
<div class="boss-health-container" id="bossHealthContainer">
    <div class="boss-health-bar" id="bossHealthBar">
        <div class="boss-health-delayed" id="bossHealthDelayed"></div>
        <div class="boss-health-fill" id="bossHealthFill"></div>
        <div class="boss-health-ornament-left"></div>
        <div class="boss-health-ornament-right"></div>
        <div class="boss-name" id="bossName"></div>
    </div>
</div>



</body>
</html>
