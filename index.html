<!DOCTYPE html>
<html lang="ru" class="is-menu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Philosopher:wght@400;700&family=Pangolin&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="main_css.css?v=levelup-modal-mobile-fit-2">
	<link rel="stylesheet" href="index_css.css?v=restless-village-2026-08-06">
    <title>Выбор уровня</title>

</head>
<body class="menu-page">

<header class="menu-topbar">
    <div class="skill-points-display" id="skillPointsDisplay">
        <span class="skill-points-icon">⚡</span>
        <span class="skill-points-label">Очки мастерства:</span>
        <span class="skill-points-value" id="skillPointsValue">0</span>
        <div class="skill-points-tooltip">
            Очки мастерства начисляются за скорость прохождения уровней: чем быстрее вы проходите уровень, тем больше очков получаете!
            (Если уровень проходится дольше 10 минут, очки не начисляются.)
        </div>
    </div>

    <div class="menu-actions">
        <div class="select-character-button" id="selectCharacterBtn">Персонажи</div>
        <button type="button" class="select-character-button" id="openSettingsBtn" aria-label="Настройки звука">⚙ Настройки</button>
        <button type="button" class="select-character-button menu-debug-btn" id="unlockDebugBtn">Разблокировать всё</button>
        <button type="button" class="select-character-button menu-debug-btn" id="clearProgressBtn"
            title="Аварийный сброс локального прогресса">Сбросить всё</button>
    </div>
</header>

<main class="menu-main">
    <div class="area-block">
        <div class="area-block-corner area-block-corner-tl" aria-hidden="true"></div>
        <div class="area-block-corner area-block-corner-tr" aria-hidden="true"></div>
        <div class="area-block-corner area-block-corner-bl" aria-hidden="true"></div>
        <div class="area-block-corner area-block-corner-br" aria-hidden="true"></div>

        <div class="menu-hero" id="areaHeader">

        </div>

        <nav class="levels-grid" id="levelsGrid" aria-label="Список уровней">
        </nav>

        <div class="area-nav" id="areaNav"></div>
    </div>
</main>

<script src="lvlData/areas.js?v=unlock-stubs-2026-08-14"></script>
<script src="saveData.js?v=upgrade-bundles-v1-2026-08-20"></script>
<script src="music/audio-settings.js?v=audio-settings-2026-08-11"></script>
<script src="music/hub-music.js?v=hub-music-tab-pause-2026-08-04"></script>

<script>
// ==================== Рендер текущей области и её уровней ====================
const LEVEL_LINK_VERSION = 'area-preview-levels-2026-08-05';

const requestedArea = Number(new URLSearchParams(window.location.search).get('area'));
const currentAreaIndex = Number.isInteger(requestedArea) && requestedArea >= 1 && requestedArea <= AREAS.length
    ? requestedArea - 1
    : 0;
const currentArea = AREAS[currentAreaIndex];
document.body.dataset.area = String(currentArea.id);

const areaHeaderEl = document.getElementById('areaHeader');
areaHeaderEl.innerHTML = `
    <h1 class="area-title"><span class="area-emoji" aria-hidden="true">${currentArea.emoji}</span> ${currentArea.title}</h1>
`;

const levelsGridEl = document.getElementById('levelsGrid');
let levelsMarkup = '';
for (let levelNumber = currentArea.levelStart; levelNumber <= currentArea.levelEnd; levelNumber++) {
    const paddedNumber = String(levelNumber).padStart(2, '0');
    const title = getLevelDisplayTitle(levelNumber);
    const stubClass = isLevelStubContent(levelNumber) ? ' stub' : '';
    const stubRibbon = isLevelStubContent(levelNumber)
        ? '<span class="stub-ribbon">В разработке</span>'
        : '';

    if (isLevelReady(levelNumber)) {
        levelsMarkup += `
            <a href="level.html?level=${levelNumber}&v=${LEVEL_LINK_VERSION}" class="level locked${stubClass}" data-level="${levelNumber}">
                <span class="level-num">${paddedNumber}</span>
                <span class="level-body">
                    <span class="level-label">Уровень ${levelNumber}</span>
                    <span class="level-name">${title}</span>
                </span>
                <span class="level-status" aria-hidden="true"></span>
                ${stubRibbon}
            </a>`;
    } else {
        levelsMarkup += `
            <div class="level locked stub" data-level="${levelNumber}">
                <span class="level-num">${paddedNumber}</span>
                <span class="level-body">
                    <span class="level-label">Уровень ${levelNumber}</span>
                    <span class="level-name">${title}</span>
                </span>
                <span class="level-status" aria-hidden="true"></span>
                <span class="stub-ribbon">В разработке</span>
            </div>`;
    }
}
levelsGridEl.innerHTML = levelsMarkup;

const areaNavEl = document.getElementById('areaNav');
const prevArea = AREAS[currentAreaIndex - 1];
const nextArea = AREAS[currentAreaIndex + 1];
const currentAreaCleared = gameState.lastCompletedLevel >= currentArea.levelEnd;

function renderNextAreaButton() {
    if (!nextArea) return '<span class="area-nav-btn area-nav-end">Дальше пока не открыто</span>';
    if (!currentAreaCleared) {
        return `<span class="area-nav-btn area-nav-locked" title="Пройдите все уровни текущей области">🔒 Пройдите уровень ${currentArea.levelEnd}, чтобы открыть</span>`;
    }
    return `<a class="area-nav-btn area-nav-next" href="index.html?area=${nextArea.id}">${nextArea.preposition} ${nextArea.titleAcc || nextArea.title} →</a>`;
}

areaNavEl.innerHTML = `
    ${prevArea
        ? `<a class="area-nav-btn area-nav-prev" href="index.html?area=${prevArea.id}">← ${prevArea.preposition} ${prevArea.titleAcc || prevArea.title}</a>`
        : '<span class="area-nav-btn area-nav-placeholder"></span>'}
    ${renderNextAreaButton()}
`;

// ==================== Работа с localStorage и уровнями ====================
const lastUnlockLevel = gameState.lastCompletedLevel + 1;
const levels = document.querySelectorAll('a.level[data-level]');
levels.forEach(link => {
    const levelNumber = parseInt(link.dataset.level, 10);
    if (levelNumber <= lastUnlockLevel) {
        link.classList.remove('locked');
        link.classList.add('unlocked');
    }
});

// ==================== Секретная разблокировка для отладки ====================
const unlockDebugBtn = document.getElementById('unlockDebugBtn');

function openDebugUnlockModal() {
    const oldModal = document.querySelector('.debug-unlock-modal');
    if (oldModal) oldModal.remove();

    const modal = document.createElement('div');
    modal.className = 'debug-unlock-modal';
    modal.innerHTML = `
        <div class="debug-unlock-dialog" role="dialog" aria-modal="true" aria-labelledby="debugUnlockTitle">
            <button type="button" class="debug-unlock-close" aria-label="Закрыть">&times;</button>
            <h2 id="debugUnlockTitle">Отладочная разблокировка</h2>
            <p>Введите секретное слово</p>
            <form class="debug-unlock-form">
                <label class="debug-unlock-label" for="debugSecretInput">Секретное слово</label>
                <input id="debugSecretInput" class="debug-unlock-input" type="password" autocomplete="off" required>
                <p class="debug-unlock-status" role="status" aria-live="polite"></p>
                <div class="debug-unlock-actions">
                    <button type="button" class="debug-unlock-cancel">Отмена</button>
                    <button type="submit" class="debug-unlock-submit">Применить</button>
                </div>
            </form>
        </div>
    `;

    const closeButton = modal.querySelector('.debug-unlock-close');
    const cancelButton = modal.querySelector('.debug-unlock-cancel');
    const form = modal.querySelector('.debug-unlock-form');
    const input = modal.querySelector('.debug-unlock-input');
    const status = modal.querySelector('.debug-unlock-status');

    const closeModal = () => modal.remove();
    closeButton.addEventListener('click', closeModal);
    cancelButton.addEventListener('click', closeModal);
    modal.addEventListener('click', event => {
        if (event.target === modal) closeModal();
    });

    form.addEventListener('submit', event => {
        event.preventDefault();

        const maxAvailableLevel = CAMPAIGN_FINAL_LEVEL;
        const result = typeof unlockAllLevelsForDebug === 'function'
            ? unlockAllLevelsForDebug(input.value, maxAvailableLevel)
            : { success: false, reason: 'function-missing' };

        if (!result.success) {
            status.className = 'debug-unlock-status is-error';
            status.textContent = result.reason === 'save-failed'
                ? 'Не удалось сохранить прогресс.'
                : 'Неверное секретное слово.';
            input.value = '';
            input.focus();
            return;
        }

        status.className = 'debug-unlock-status is-success';
        status.textContent = `Готово: открыты уровни 1–${result.unlockedThrough}, герои разблокированы, начислено ${result.reward.toLocaleString('ru-RU')} злат.`;
        input.disabled = true;
        form.querySelector('.debug-unlock-submit').disabled = true;
        setTimeout(() => location.reload(), 900);
    });

    document.body.appendChild(modal);
    input.focus();
}

if (unlockDebugBtn) {
    unlockDebugBtn.addEventListener('click', openDebugUnlockModal);
}

// ==================== Окно настроек звука ====================
const openSettingsBtn = document.getElementById('openSettingsBtn');

function openSettingsModal() {
    const oldModal = document.querySelector('.settings-modal');
    if (oldModal) oldModal.remove();

    const musicVolume = window.audioSettings?.getMusicVolume() ?? 10;
    const sfxVolume = window.audioSettings?.getSfxVolume() ?? 10;

    const modal = document.createElement('div');
    modal.className = 'settings-modal debug-unlock-modal';
    modal.innerHTML = `
        <div class="debug-unlock-dialog settings-dialog" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
            <button type="button" class="debug-unlock-close" aria-label="Закрыть">&times;</button>
            <h2 id="settingsTitle">Настройки</h2>
            <div class="settings-row">
                <span class="settings-row-label">Музыка</span>
                <div class="settings-slider-wrap">
                    <input type="range" class="settings-slider" id="settingsMusicSlider" min="0" max="100" step="1" value="${musicVolume}">
                    <span class="settings-slider-value" id="settingsMusicValue">${musicVolume}</span>
                </div>
            </div>
            <div class="settings-row">
                <span class="settings-row-label">Звуки</span>
                <div class="settings-slider-wrap">
                    <input type="range" class="settings-slider" id="settingsSfxSlider" min="0" max="100" step="1" value="${sfxVolume}">
                    <span class="settings-slider-value" id="settingsSfxValue">${sfxVolume}</span>
                </div>
            </div>
        </div>
    `;

    const closeModal = () => modal.remove();
    modal.querySelector('.debug-unlock-close').addEventListener('click', closeModal);
    modal.addEventListener('click', event => {
        if (event.target === modal) closeModal();
    });

    const musicSlider = modal.querySelector('#settingsMusicSlider');
    const musicValue = modal.querySelector('#settingsMusicValue');
    musicSlider.addEventListener('input', event => {
        const value = Number(event.target.value);
        musicValue.textContent = value;
        window.audioSettings?.setMusicVolume(value);
    });

    const sfxSlider = modal.querySelector('#settingsSfxSlider');
    const sfxValue = modal.querySelector('#settingsSfxValue');
    sfxSlider.addEventListener('input', event => {
        const value = Number(event.target.value);
        sfxValue.textContent = value;
        window.audioSettings?.setSfxVolume(value);
    });

    document.body.appendChild(modal);
}

if (openSettingsBtn) {
    openSettingsBtn.addEventListener('click', openSettingsModal);
}

// ==================== Кнопка очистки прогресса ====================
const clearBtn = document.getElementById('clearProgressBtn');

function openCriticalProgressResetConfirmation() {
    if (document.querySelector('.critical-reset-modal')) return;

    const confirmation = document.createElement('div');
    confirmation.className = 'reset-confirm-modal critical-reset-modal';
    confirmation.innerHTML = `
        <div class="reset-confirm-dialog critical-reset-dialog" role="alertdialog" aria-modal="true"
            aria-labelledby="criticalResetTitle" aria-describedby="criticalResetDescription">
            <button type="button" class="reset-confirm-close" aria-label="Закрыть">&times;</button>
            <div class="reset-confirm-emblem" aria-hidden="true">!</div>
            <h3 id="criticalResetTitle">Сбросить весь прогресс?</h3>
            <p id="criticalResetDescription" class="reset-confirm-description">
                Это аварийная кнопка только на случай критических багов. В обычной игре пользоваться ей не нужно.
            </p>
            <div class="critical-reset-summary">
                <span>Будут удалены с этого устройства:</span>
                <strong>уровни, злато, прокачка героев и результаты прохождений</strong>
            </div>
            <p class="reset-confirm-warning">Отменить это действие будет нельзя.</p>
            <div class="reset-confirm-actions">
                <button type="button" class="reset-confirm-no">Нет</button>
                <button type="button" class="reset-confirm-yes">Да, сбросить всё</button>
            </div>
        </div>
    `;

    document.body.appendChild(confirmation);
    const dialog = confirmation.querySelector('.critical-reset-dialog');
    const closeButton = confirmation.querySelector('.reset-confirm-close');
    const cancelButton = confirmation.querySelector('.reset-confirm-no');
    const confirmButton = confirmation.querySelector('.reset-confirm-yes');
    const title = confirmation.querySelector('#criticalResetTitle');
    const description = confirmation.querySelector('#criticalResetDescription');
    let closed = false;

    const closeConfirmation = () => {
        if (closed) return;
        closed = true;
        document.removeEventListener('keydown', handleConfirmationKeydown);
        confirmation.classList.add('is-closing');
        window.setTimeout(() => confirmation.remove(), 140);
    };

    const handleConfirmationKeydown = event => {
        if (event.key === 'Escape') closeConfirmation();
    };

    closeButton.addEventListener('click', closeConfirmation);
    cancelButton.addEventListener('click', closeConfirmation);
    confirmation.addEventListener('click', event => {
        if (event.target === confirmation) closeConfirmation();
    });
    document.addEventListener('keydown', handleConfirmationKeydown);

    confirmButton.addEventListener('click', () => {
        confirmButton.disabled = true;
        cancelButton.disabled = true;
        dialog.classList.add('is-processing');

        if (typeof clearGameState === 'function' && clearGameState()) {
            window.location.reload();
            return;
        }

        dialog.classList.remove('is-processing');
        dialog.classList.add('is-error');
        title.textContent = 'Сброс не выполнен';
        description.textContent = 'Не удалось очистить локальные данные. Прогресс остался без изменений.';
        confirmButton.hidden = true;
        cancelButton.disabled = false;
        cancelButton.textContent = 'Закрыть';
        cancelButton.focus();
    });

    window.requestAnimationFrame(() => {
        confirmation.classList.add('is-visible');
        cancelButton.focus();
    });
}

if (clearBtn) {
    clearBtn.addEventListener('click', openCriticalProgressResetConfirmation);
}

// ==================== Модальное окно выбора персонажа ====================
const selectBtn = document.getElementById('selectCharacterBtn');
let currentSelectedHero = null;
let upgradeBtnInModal = null;
let upgradeInfoSpan = null;
const levelUpSound = new Audio('sound/level_up.wav?v=1');
levelUpSound.preload = 'auto';

function playLevelUpSound() {
    const volume = window.audioSettings?.getSfxVolumeFactor() ?? 0.10;
    if (volume <= 0) return;
    levelUpSound.volume = volume;
    levelUpSound.currentTime = 0;
    const playback = levelUpSound.play();
    if (playback && typeof playback.catch === 'function') {
        playback.catch(() => {});
    }
}

function openCharacterSelect() {
    const oldModal = document.querySelector('.character-select-modal');
    if (oldModal) oldModal.remove();

    const modal = document.createElement('div');
    modal.className = 'character-select-modal';
    modal.innerHTML = `
        <div class="modal-content">
            <span class="close-modal">&times;</span>
            <h2>Выбор и развитие персонажей</h2>
            <div class="character-grid" id="characterGrid"></div>
            <div class="character-info" id="characterInfo">
                <p class="info-placeholder">Выберите персонажа</p>
            </div>
		<div class="modal-actions">

			<button class="reset-upgrades-btn" id="resetAllUpgradesBtn">Сбросить прокачку</button>
			<div class="upgrade-wrapper">
			<div class="upgrade-cost" id="upgradeCostModal"></div>
				<button class="upgrade-hero-btn" id="upgradeHeroModalBtn" disabled>Повысить уровень</button>
				
			</div>
			<button class="select-hero-btn" id="selectHeroBtn" disabled>Выбрать персонажа</button>
		</div>
        </div>
    `;
    document.body.appendChild(modal);

    const grid = document.getElementById('characterGrid');
    const infoPanel = document.getElementById('characterInfo');
    const selectHeroBtn = document.getElementById('selectHeroBtn');
    upgradeBtnInModal = document.getElementById('upgradeHeroModalBtn');
    upgradeInfoSpan = document.getElementById('upgradeCostModal');
    const resetAllUpgradesBtn = document.getElementById('resetAllUpgradesBtn');

    let currentSelectedElement = null;
    let currentHeroKey = null;

	function updateUpgradeButton(hero) {
		if (!hero) return;
		if (hero.level >= HERO_MAX_LEVEL) {
			upgradeBtnInModal.disabled = true;
			upgradeBtnInModal.style.background = ''; // возвращаем цвет CSS (--gp-wood текущей области)
			upgradeInfoSpan.innerHTML = `Достигнут максимальный уровень (${HERO_MAX_LEVEL})`;
			return;
		}
		const cost = hero.zlataUp;
		const hasEnough = gameState.zlata >= cost;
		if (hasEnough) {
			upgradeBtnInModal.disabled = false;
			upgradeBtnInModal.style.background = "linear-gradient(135deg, #2e6b2e, #1e4a1e)"; // семантика "можно повысить" — зелёный не зависит от области
			upgradeInfoSpan.innerHTML = `Стоимость повышения: ${cost} <img src="images/other/zlata.webp" class="zlata-icon">`;
		} else {
			upgradeBtnInModal.disabled = true;
			upgradeBtnInModal.style.background = ''; // возвращаем цвет CSS (--gp-wood текущей области)
			const deficit = cost - gameState.zlata;
			upgradeInfoSpan.innerHTML = `Не хватает ${deficit} <img src="images/other/zlata.webp" class="zlata-icon">`;
		}
	}

	function updateResetButton() {
		const refund = getAllHeroUpgradeRefund();
		resetAllUpgradesBtn.disabled = refund <= 0;
		resetAllUpgradesBtn.textContent = refund > 0
			? `Сбросить всё (+${refund.toLocaleString('ru-RU')} злат)`
			: 'Сбросить прокачку';
	}

    function formatPercent(value) {
        return `${Number((value * 100).toFixed(2))}%`;
    }

    // Дробные значения статов (теперь возможны — прокачка идёт строго
    // поюнитно из *PerLevel на объекте героя, см. saveData.js) показываем
    // максимум с 2 знаками после точки, лишние нули отбрасываются.
    function formatStatNumber(value) {
        return Number(Number(value).toFixed(2));
    }

    function getHeroDifficultyMarkup(hero) {
        const difficulty = calculateHeroDifficulty(hero);
        const formattedDifficulty = difficulty.toFixed(1).replace('.', ',');
        const stars = Array.from({ length: 5 }, (_, index) => {
            const starFill = Math.round(
                Math.min(1, Math.max(0, difficulty - index)) * 1000
            ) / 10;
            return `<span class="difficulty-star" style="--star-fill: ${starFill}%;">★</span>`;
        }).join('');

        return `
            <div class="hero-difficulty"
                role="img"
                aria-label="Сложность игры за персонажа: ${formattedDifficulty} из 5"
                title="Рассчитывается относительно героев того же уровня по выживаемости, среднему урону, темпу атаки и особенностям">
                <span class="difficulty-label">Сложность:</span>
                <span class="difficulty-stars" aria-hidden="true">${stars}</span>
                <span class="difficulty-value">${formattedDifficulty} / 5</span>
            </div>
        `;
    }

    function updateInfoPanel(heroKey) {
        const hero = gameState[heroKey];
        if (!hero || !hero.unlock) return;

        // Нулевой шанс ранения — не временно низкий, а архетипная черта героя
        // (заморожен насовсем, никогда не растёт) — самой строки в карточке тогда нет,
        // а не "0%": ноль тут не характеристика, а отсутствие механики.
        const woundStatRow = hero.startGlobalWoundChance > 0
            ? `<p><span>${hero.woundChanceLabel ?? 'Шанс ранения'}:</span> <span class="value stat-wound">${formatPercent(hero.startGlobalWoundChance)}</span></p>`
            : '';

        infoPanel.innerHTML = `
            <h3>${hero.dispName}</h3>
            ${getHeroDifficultyMarkup(hero)}
            <div class="character-info-content">
                <div class="character-stats">
                    <div class="hero-stats">
						<div class="stats-intro">
							<div class="statH">Стартовые характеристики:</div>
							<div class="stats-intro-copy">
								(Характеристики, с которыми персонаж<br>
								начинает прохождение уровней.<br>
								Чем выше та или иная характеристика,<br>
								тем сильнее будут её временные усиления<br>
								при прохождении уровней.)
							</div>
						</div>
						<p><span>Уровень:</span> <span class="value stat stat-level">${Math.round(hero.level)}</span></p>
                        <p><span>Урон:</span> <span class="value stat-damage">${formatStatNumber(hero.startGlobalDamage)}</span></p>
                        <p><span>Разброс урона:</span> <span class="value stat-damage-variance">${formatPercent(getHeroDamageVariance(hero))}</span></p>
                        <p><span>Шанс критического урона:</span> <span class="value stat-critChance">${formatPercent(hero.startGlobalCritChance)}</span></p>
                        <p><span>Критический урон:</span> <span class="value stat-critMulti">${formatStatNumber(hero.startGlobalCritMultiplier * 100)}%</span></p>
                        ${woundStatRow}
                        <p><span>Скорость атаки:</span> <span class="value stat-speed">${formatStatNumber(1000 - hero.startSHOT_INTERVAL)}</span></p>
                        <p><span>Здоровье:</span> <span class="value stat-hp">${formatStatNumber(hero.heroHP)}</span></p>
                        <p><span>Защита (снижение урона):</span> <span class="value stat-def">${formatPercent(hero.startHeroDamageReduction)}</span></p>
                        <p class="feature-container">
                          <span class="featur">Особенность:</span>
                          <span class="value">${hero.feature}</span>
                        </p>
                    </div>
                </div>
                <div class="character-fullimage">
                    <img src="${hero.fullImage}" alt="${hero.dispName}">
                </div>
            </div>
        `;
        updateUpgradeButton(hero);
        updateResetButton();
    }

		function previewUpgrade() {
			if (!currentHeroKey) return;
			const hero = gameState[currentHeroKey];
			if (!hero || !hero.unlock || upgradeBtnInModal.disabled) return;
			if (hero.level >= HERO_MAX_LEVEL) return;
			 
			// Создаём копию героя с улучшениями (не трогая оригинал)
			const upgraded = heroUp(currentHeroKey, true);
			if (!upgraded) return;

			const fields = [
				{ current: hero.startGlobalDamage, new: upgraded.startGlobalDamage, class: 'stat-damage', factor: 1, suffix: '' },
				{ current: hero.startGlobalCritChance, new: upgraded.startGlobalCritChance, class: 'stat-critChance', factor: 100, suffix: '%' },
				{ current: hero.startGlobalCritMultiplier, new: upgraded.startGlobalCritMultiplier, class: 'stat-critMulti', factor: 100, suffix: '%' },
				{ current: hero.startGlobalWoundChance, new: upgraded.startGlobalWoundChance, class: 'stat-wound', factor: 100, suffix: '%' },
				{ current: 1000 - hero.startSHOT_INTERVAL, new: 1000 - upgraded.startSHOT_INTERVAL, class: 'stat-speed', factor: 1, suffix: '' },
				{ current: hero.heroHP, new: upgraded.heroHP, class: 'stat-hp', factor: 1, suffix: '' },
				{ current: hero.startHeroDamageReduction, new: upgraded.startHeroDamageReduction, class: 'stat-def', factor: 100, suffix: '%' }
			];

			fields.forEach(f => {
				const elements = infoPanel.querySelectorAll(`.${f.class}`);
				elements.forEach(el => {
					const oldVal = f.factor ? (f.current * f.factor) : f.current;
					const newVal = f.factor ? (f.new * f.factor) : f.new;
					const diff = newVal - oldVal;
					if (Math.abs(diff) > 0.001) {
						// Формируем строку изменения. Раньше тут всегда стояло .toFixed(0) —
						// дробные приросты (например +0.5% защиты) отображались как "+0%".
						// Теперь — максимум 2 знака после точки, лишние нули отбрасываются
						// (formatStatNumber, тот же принцип, что и в основном отображении).
						const diffRounded = formatStatNumber(diff);
						let diffText = (diffRounded > 0 ? '+' : '') + diffRounded;
						if (f.suffix) diffText += f.suffix;
						const span = document.createElement('span');
						span.className = 'stat-diff';
						span.textContent = ' ' + diffText;
						span.style.color = '#005109';
						span.style.fontWeight = 'bold';
						// Вставляем после текущего элемента
						el.parentNode.insertBefore(span, el.nextSibling);
						// Сохраняем ссылку на созданный элемент для удаления
						el.setAttribute('data-has-diff', 'true');
						if (!el._diffSpan) el._diffSpan = span;
					}
				});
			});
		}

		function revertPreview() {
			const statClasses = ['stat-damage', 'stat-critChance', 'stat-critMulti', 'stat-wound', 'stat-speed', 'stat-hp', 'stat-def'];
			statClasses.forEach(cls => {
				const elements = infoPanel.querySelectorAll(`.${cls}`);
				elements.forEach(el => {
					if (el._diffSpan) {
						el._diffSpan.remove();
						delete el._diffSpan;
					}
					el.removeAttribute('data-has-diff');
				});
			});
		}

		function playLevelUpAnimation(level) {
			const oldCelebration = infoPanel.querySelector('.level-up-celebration');
			if (oldCelebration) oldCelebration.remove();

			infoPanel.classList.remove('level-up-impact');
			currentSelectedElement?.classList.remove('level-up-portrait');
			void infoPanel.offsetWidth;

			const celebration = document.createElement('div');
			celebration.className = 'level-up-celebration';
			celebration.setAttribute('aria-hidden', 'true');
			celebration.innerHTML = `
				<div class="level-up-rays"></div>
				<div class="level-up-ring"></div>
				<div class="level-up-message">
					<span class="level-up-title">Уровень повышен</span>
					<span class="level-up-number">${Math.round(level)}</span>
				</div>
				<span class="level-up-spark spark-1">✦</span>
				<span class="level-up-spark spark-2">✦</span>
				<span class="level-up-spark spark-3">✦</span>
				<span class="level-up-spark spark-4">✦</span>
				<span class="level-up-spark spark-5">✦</span>
				<span class="level-up-spark spark-6">✦</span>
			`;

			infoPanel.appendChild(celebration);
			infoPanel.classList.add('level-up-impact');
			currentSelectedElement?.classList.add('level-up-portrait');
			infoPanel.querySelector('.stat-level')?.classList.add('level-up-value');

			window.setTimeout(() => {
				celebration.remove();
				infoPanel.classList.remove('level-up-impact');
				currentSelectedElement?.classList.remove('level-up-portrait');
			}, 1200);
		}
		
		
		function upgradeHero() {
			if (!currentHeroKey) return;
			const hero = gameState[currentHeroKey];
			if (!hero || !hero.unlock) return;
			if (hero.level >= HERO_MAX_LEVEL) {
				alert(`Персонаж достиг максимального уровня (${HERO_MAX_LEVEL})`);
				return;
			}
			const cost = hero.zlataUp;
			if (gameState.zlata >= cost) {
				heroUp(currentHeroKey, false);
				const updatedHero = gameState[currentHeroKey];
				updateUpgradeButton(updatedHero);
				updateInfoPanel(currentHeroKey);
				updateResetButton();
				playLevelUpAnimation(updatedHero.level);
				playLevelUpSound();
			} else {
				alert("Недостаточно злата!");
			}
		}

		function showResetNotice(refund) {
			const oldNotice = modal.querySelector('.reset-upgrades-notice');
			if (oldNotice) oldNotice.remove();

			const notice = document.createElement('div');
			notice.className = 'reset-upgrades-notice';
			notice.setAttribute('role', 'status');
			notice.innerHTML = `
				<span class="reset-notice-mark" aria-hidden="true">✓</span>
				<span>Прокачка сброшена. Возвращено <strong>${refund.toLocaleString('ru-RU')}</strong> злат.</span>
			`;
			modal.querySelector('.modal-content')?.appendChild(notice);
			window.setTimeout(() => notice.remove(), 2400);
		}

		function openResetUpgradesConfirmation(refund) {
			if (document.querySelector('.reset-confirm-modal')) return;

			const confirmation = document.createElement('div');
			confirmation.className = 'reset-confirm-modal';
			confirmation.innerHTML = `
				<div class="reset-confirm-dialog" role="alertdialog" aria-modal="true"
					aria-labelledby="resetConfirmTitle" aria-describedby="resetConfirmDescription">
					<button type="button" class="reset-confirm-close" aria-label="Закрыть">&times;</button>
					<div class="reset-confirm-emblem" aria-hidden="true">↶</div>
					<h3 id="resetConfirmTitle">Сбросить всю прокачку?</h3>
					<p id="resetConfirmDescription" class="reset-confirm-description">
						Уровни и улучшения всех героев вернутся к исходным значениям.
					</p>
					<div class="reset-confirm-refund">
						<span>Будет возвращено</span>
						<strong>${refund.toLocaleString('ru-RU')} злат</strong>
						<img src="images/other/zlata.webp" alt="">
					</div>
					<p class="reset-confirm-warning">Прогресс прохождения уровней при этом не сбрасывается.</p>
					<div class="reset-confirm-actions">
						<button type="button" class="reset-confirm-no">Нет</button>
						<button type="button" class="reset-confirm-yes">Да, сбросить</button>
					</div>
				</div>
			`;

			document.body.appendChild(confirmation);
			const dialog = confirmation.querySelector('.reset-confirm-dialog');
			const closeButton = confirmation.querySelector('.reset-confirm-close');
			const cancelButton = confirmation.querySelector('.reset-confirm-no');
			const confirmButton = confirmation.querySelector('.reset-confirm-yes');
			const title = confirmation.querySelector('#resetConfirmTitle');
			const description = confirmation.querySelector('#resetConfirmDescription');
			let closed = false;

			const closeConfirmation = () => {
				if (closed) return;
				closed = true;
				document.removeEventListener('keydown', handleConfirmationKeydown);
				confirmation.classList.add('is-closing');
				window.setTimeout(() => confirmation.remove(), 140);
			};

			const handleConfirmationKeydown = event => {
				if (event.key === 'Escape') closeConfirmation();
			};

			closeButton.addEventListener('click', closeConfirmation);
			cancelButton.addEventListener('click', closeConfirmation);
			confirmation.addEventListener('click', event => {
				if (event.target === confirmation) closeConfirmation();
			});
			document.addEventListener('keydown', handleConfirmationKeydown);

			confirmButton.addEventListener('click', () => {
				confirmButton.disabled = true;
				cancelButton.disabled = true;
				dialog.classList.add('is-processing');

				const result = resetAllHeroUpgrades();
				if (!result.success) {
					dialog.classList.remove('is-processing');
					dialog.classList.add('is-error');
					title.textContent = 'Сброс не выполнен';
					description.textContent = 'Не удалось сохранить изменения. Прокачка героев осталась без изменений.';
					confirmButton.hidden = true;
					cancelButton.disabled = false;
					cancelButton.textContent = 'Закрыть';
					cancelButton.focus();
					return;
				}

				if (currentHeroKey && gameState[currentHeroKey]) {
					updateInfoPanel(currentHeroKey);
				}
				updateResetButton();
				closeConfirmation();
				showResetNotice(result.refund);
			});

			window.requestAnimationFrame(() => {
				confirmation.classList.add('is-visible');
				cancelButton.focus();
			});
		}

		function resetAllUpgrades() {
			const refund = getAllHeroUpgradeRefund();
			if (refund <= 0) return;
			openResetUpgradesConfirmation(refund);
		}

		resetAllUpgradesBtn.addEventListener('click', resetAllUpgrades);

    // Построение сетки портретов
    gameState.mHero.forEach(heroKey => {
        const hero = gameState[heroKey];
        if (!hero) return;

        const portrait = document.createElement('div');
        portrait.className = 'character-portrait';
        portrait.dataset.hero = heroKey;

        if (hero.unlock) {
            const img = document.createElement('img');
            img.src = hero.image;
            img.alt = hero.dispName;
            portrait.appendChild(img);
        } else {
            portrait.classList.add('locked');
            portrait.textContent = '?';
        }

        if (heroKey === gameState.activeHero && hero.unlock) {
            portrait.classList.add('selected', 'active-hero');
            portrait.title = 'Выбран для игры';
            currentSelectedHero = heroKey;
            currentSelectedElement = portrait;
            currentHeroKey = heroKey;
            updateInfoPanel(heroKey);
            selectHeroBtn.disabled = false;
        }

        portrait.addEventListener('click', () => {
            if (currentSelectedElement) {
                currentSelectedElement.classList.remove('selected');
            }
            portrait.classList.add('selected');
            currentSelectedElement = portrait;
            currentSelectedHero = heroKey;
            currentHeroKey = heroKey;

            if (!hero.unlock) {
                infoPanel.innerHTML = `<p class="locked-message">Герой будет доступен после прохождения уровня ${hero.lvlUnlock}.</p>`;
                selectHeroBtn.disabled = true;
                upgradeBtnInModal.disabled = true;
                upgradeInfoSpan.innerHTML = '';
                return;
            }

            updateInfoPanel(heroKey);
            selectHeroBtn.disabled = false;
        });

        grid.appendChild(portrait);
    });

    selectHeroBtn.addEventListener('click', () => {
        if (currentSelectedHero) {
            const previousActivePortrait = grid.querySelector('.active-hero');
            if (previousActivePortrait) {
                previousActivePortrait.classList.remove('active-hero');
                previousActivePortrait.removeAttribute('title');
            }
            currentSelectedElement?.classList.add('active-hero');
            if (currentSelectedElement) {
                currentSelectedElement.title = 'Выбран для игры';
            }
            gameState.activeHero = currentSelectedHero;
            saveGameState();
            modal.remove();
        }
    });

    if (upgradeBtnInModal) {
        upgradeBtnInModal.addEventListener('mouseenter', previewUpgrade);
        upgradeBtnInModal.addEventListener('mouseleave', revertPreview);
        upgradeBtnInModal.addEventListener('click', upgradeHero);
		upgradeBtnInModal.addEventListener('click', previewUpgrade);
    }

    modal.querySelector('.close-modal').addEventListener('click', () => {
        modal.remove();
    });

    modal.addEventListener('click', (e) => {
        if (e.target === modal) {
            modal.remove();
        }
    });
}

// ==================== ОТОБРАЖЕНИЕ ОЧКОВ МАСТЕРСТВА ====================
function updateSkillPointsDisplay() {
    const pointsSpan = document.getElementById('skillPointsValue');
    if (pointsSpan) {
        const points = (typeof gameState !== 'undefined' && gameState.skillPoints !== undefined) ? gameState.skillPoints : 0;
        pointsSpan.textContent = points;
    }
}

// Вызываем при загрузке
updateSkillPointsDisplay();

selectBtn.addEventListener('click', openCharacterSelect)
</script>
